name: 📊 GitHub Metrics

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      - name: 📈 Generate GitHub Stats
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: WooCSSIN
          template: classic
          base: header, activity, community, repositories
          config_timezone: Asia/Ho_Chi_Minh
          filename: .github/assets/stats.svg
          output_action: commit
          committer_message: "chore: update github stats [skip ci]"

      - name: 🌐 Generate Top Languages
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: WooCSSIN
          base: ""
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
          plugin_languages_details: percentage
          config_timezone: Asia/Ho_Chi_Minh
          filename: .github/assets/languages.svg
          output_action: commit
          committer_message: "chore: update language stats [skip ci]"
